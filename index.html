<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conchen Eyewear Development Wizard</title>
<style>
:root{font-family:Inter,system-ui,Arial;color:#111827;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.mark{width:36px;height:36px;border-radius:11px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900}.muted{color:#64748b}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid #dbe2ea;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.primary{background:#111827;color:#fff;border-color:#111827}.progress{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 16px;display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.progress button{border:0;background:transparent;color:#94a3b8;font-size:11px;padding:5px}.progress button.on{color:#111827;font-weight:800}.wrap{max-width:1400px;margin:auto;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:26px;box-shadow:0 8px 30px rgba(15,23,42,.035)}h1{font-size:30px;margin:0 0 8px}h2{font-size:18px;margin:26px 0 8px}h3{font-size:14px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #dbe2ea;background:#fff;border-radius:14px;padding:10px;cursor:pointer;text-align:left}.card.sel{border:2px solid #111827}.vis{height:105px;background:linear-gradient(#fafbfc,#f4f6f8);border-radius:10px;display:grid;place-items:center;margin-bottom:8px}.vis svg{width:100%;height:100%}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:inherit}.pill{display:flex;gap:7px;flex-wrap:wrap}.pill button{border:1px solid #dbe2ea;background:#fff;border-radius:999px;padding:8px 11px}.pill button.sel{background:#111827;color:#fff}.nav{display:flex;justify-content:space-between;margin-top:24px}.side{position:sticky;top:132px}.summary{display:grid;gap:10px}.sum{padding-bottom:10px;border-bottom:1px solid #eef2f7}.sum b{display:block;font-size:10px;text-transform:uppercase;color:#64748b}.ref{display:grid;grid-template-columns:120px 1fr;gap:12px;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:10px 0}.ref img{width:120px;height:90px;object-fit:contain;background:#f8fafc;border-radius:8px}.checks{display:flex;gap:6px;flex-wrap:wrap}.checks label{font-size:11px;border:1px solid #e2e8f0;border-radius:999px;padding:5px 8px}.measure{background:#f8fafc;border-radius:14px;padding:10px}.measure svg{width:100%;height:260px}.hotspots{display:grid;grid-template-columns:2fr 1fr;gap:16px}.logo-map{background:#f8fafc;border-radius:14px;padding:14px}.logo-map svg{width:100%;height:280px}.spot{cursor:pointer;fill:#2563eb22;stroke:#2563eb;stroke-width:2}.marklist button{width:100%;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:10px;padding:9px;margin:5px 0}.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:11px}.ok{background:#ecfdf5;border:1px solid #bbf7d0;border-radius:12px;padding:11px}.review{display:grid;grid-template-columns:1fr 1fr;gap:10px}.review>div{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.footer-note{font-size:11px;color:#64748b;margin-top:12px}@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:14px}.side{position:static;order:-1}.grid{grid-template-columns:1fr 1fr}.progress{overflow:auto;display:flex}.fields,.hotspots,.review{grid-template-columns:1fr}}[dir=rtl] .card{text-align:right}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var K='conchen-wizard-v2';
var steps=['Start','References','Frame','Size','Lens','Components','Logo','Extras','Review'];
var zh={Frame:'镜框',Lens:'镜片',Material:'材质',Color:'颜色',Finish:'表面效果',Thickness:'厚度','Base Curve':'镜片弯度',Hinge:'铰链','Nose Pad':'鼻托','Development Team Recommendation':'由开发团队建议','To Be Confirmed':'待确认','Sample Development Sheet':'眼镜样品开发单'};
var T={en:{Start:'Start',References:'References',Frame:'Frame',Size:'Size',Lens:'Lens',Components:'Components',Logo:'Logo',Extras:'Sample Extras',Review:'Review',next:'Continue',back:'Back',title:'Eyewear Sample Development Wizard',sub:'Build a clear factory-ready sample development sheet.',recommend:'Development Team Recommendation'},he:{Start:'התחלה',References:'רפרנסים',Frame:'מסגרת',Size:'מידות',Lens:'עדשות',Components:'רכיבים',Logo:'לוגו',Extras:'תוספות לדוגמה',Review:'סקירה',next:'המשך',back:'חזרה',title:'אשף פיתוח דוגמת משקפיים',sub:'בנה דף פיתוח ברור ומוכן לצוות הפיתוח במפעל.',recommend:'המלצת צוות הפיתוח'}};
function fresh(){return{lang:'en',i:0,project:{id:'',brand:'',style:'',name:'',date:new Date().toISOString().slice(0,10),type:'New Design'},refs:[],frame:{product:'Sunglasses',construction:'Full Rim',shape:'Rectangle',material:'Acetate',color:'',finish:'Glossy Solid'},size:{mode:'Known',w:'',h:'',bridge:'',front:'',temple:''},lens:{material:'Nylon',thick:'',curve:'0',color:'Green',tint:'Solid',dark:'80',treat:['UV400']},components:{hinge:'Development Team Recommendation',nose:'Integrated'},marks:[],extras:[],notes:''}}
var s;try{s=JSON.parse(localStorage.getItem(K))||fresh()}catch(e){s=fresh()}
function save(){localStorage.setItem(K,JSON.stringify(s))}
function q(x){return document.querySelector(x)}
function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function glasses(kind){var f=kind==='Rimless'?'none':'#111827';return '<svg viewBox="0 0 240 100"><g fill="none" stroke="#111827" stroke-width="4"><rect x="18" y="27" width="76" height="45" rx="'+(kind==='Round'?'22':'15')+'" fill="'+f+'"/><rect x="146" y="27" width="76" height="45" rx="'+(kind==='Round'?'22':'15')+'" fill="'+f+'"/><path d="M94 45 Q120 35 146 45M18 38L3 32M222 38l15-6"/></g></svg>'}
function matVis(m){return '<svg viewBox="0 0 240 100"><path d="M20 55Q35 20 85 25Q110 27 120 45Q130 27 155 25Q205 20 220 55" fill="none" stroke="'+(m==='Acetate'?'#111827':'#64748b')+'" stroke-width="'+(m==='Acetate'?14:5)+'" stroke-linecap="round"/><text x="120" y="82" text-anchor="middle" font-size="12" fill="#64748b">'+esc(m)+'</text></svg>'}
function curveVis(v){var y=50-Number(v)*3;return '<svg viewBox="0 0 220 100"><path d="M25 65 Q110 '+y+' 195 65" fill="none" stroke="#111827" stroke-width="5"/><path d="M25 70 Q110 '+(y+10)+' 195 70" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="110" y="92" text-anchor="middle" font-size="12">Base '+v+(v==='0'?' / Flat':'')+'</text></svg>'}
function logoVis(m){return '<svg viewBox="0 0 220 100"><rect x="20" y="38" width="180" height="24" rx="12" fill="#d8c2a6"/><text x="110" y="56" text-anchor="middle" font-size="18" font-weight="800" fill="'+(m.indexOf('Laser')>=0?'#6b4e35':'#111827')+'">TS</text><text x="110" y="85" text-anchor="middle" font-size="11" fill="#64748b">'+esc(m)+'</text></svg>'}
function card(val,label,sel,vis,act){return '<button class="card '+(sel===val?'sel':'')+'" data-a="'+act+'" data-v="'+esc(val)+'"><div class="vis">'+vis+'</div><b>'+esc(label)+'</b></button>'}
function pills(arr,sel,act){return '<div class="pill">'+arr.map(function(x){return '<button class="'+(sel===x?'sel':'')+'" data-a="'+act+'" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>'}
function inp(label,path,val,ph){return '<label class="field"><span>'+esc(label)+'</span><input data-path="'+path+'" value="'+esc(val)+'" placeholder="'+esc(ph||'')+'"></label>'}
function nav(){return '<div class="nav"><button class="btn" data-a="prev">'+(T[s.lang].back)+'</button><button class="btn primary" data-a="next">'+(s.i===steps.length-1?'Export / Print':T[s.lang].next)+'</button></div>'}
function stepStart(){return '<h1>'+T[s.lang].title+'</h1><p class="muted">'+T[s.lang].sub+'</p><div class="fields">'+inp('Development ID','project.id',s.project.id,'DEV-001')+inp('Brand / Customer','project.brand',s.project.brand,'Brand')+inp('Style / Model No.','project.style',s.project.style,'TS-001')+inp('Development Name','project.name',s.project.name,'New acetate sample')+inp('Development Date','project.date',s.project.date)+inp('Development Type','project.type',s.project.type)+'</div>'+nav()}
function stepRefs(){var aspects=['Overall Shape','Front Shape','Temple Shape','Frame Color','Lens Color','Logo','Hinge','Dimensions'];return '<h1>References</h1><p class="muted">Upload images and tell the development team exactly what to follow.</p><label class="btn">+ Add Reference<input id="refup" type="file" accept="image/*" hidden></label><div>'+s.refs.map(function(r,ri){return '<div class="ref"><img src="'+r.data+'"><div><b>'+r.id+' — '+esc(r.name)+'</b><div class="footer-note">FOLLOW</div><div class="checks">'+aspects.map(function(a){return '<label><input type="checkbox" data-ref="'+ri+'" data-type="follow" data-aspect="'+a+'" '+(r.follow.indexOf(a)>=0?'checked':'')+'> '+a+'</label>'}).join('')+'</div><div class="footer-note">DO NOT FOLLOW</div><div class="checks">'+aspects.map(function(a){return '<label><input type="checkbox" data-ref="'+ri+'" data-type="dont" data-aspect="'+a+'" '+(r.dont.indexOf(a)>=0?'checked':'')+'> '+a+'</label>'}).join('')+'</div><button class="btn" data-a="delref" data-v="'+ri+'">Delete</button></div></div>'}).join('')+'</div>'+nav()}
function stepFrame(){var mats=['Acetate','Stainless Steel','Titanium','Beta Titanium','TR90','PC / Injection'];var cons=['Full Rim','Semi-Rimless','Rimless','Combination'];var sh=['Rectangle','Round','Aviator','Cat Eye'];return '<h1>Frame</h1><h2>Construction</h2>'+pills(cons,s.frame.construction,'frame.construction')+'<h2>Shape</h2><div class="grid">'+sh.map(function(x){return card(x,x,s.frame.shape,glasses(x),'frame.shape')}).join('')+'</div><h2>Material</h2><div class="grid">'+mats.map(function(x){return card(x,x,s.frame.material,matVis(x),'frame.material')}).join('')+'</div><div class="fields">'+inp('Frame Color','frame.color',s.frame.color,'Glossy black / Pantone / Follow R01')+inp('Finish','frame.finish',s.frame.finish,'Glossy / Matte / Transparent')+'</div>'+nav()}
function measureSvg(){return '<svg viewBox="0 0 500 260"><g fill="none" stroke="#111827" stroke-width="5"><rect x="55" y="65" width="150" height="90" rx="30"/><rect x="295" y="65" width="150" height="90" rx="30"/><path d="M205 100Q250 80 295 100"/></g><g stroke="#2563eb" stroke-width="2" fill="none"><path d="M55 45H205M55 38v14M205 38v14"/><path d="M205 180H295M205 173v14M295 173v14"/><path d="M55 210H445M55 203v14M445 203v14"/></g><g fill="#2563eb" font-size="14"><text x="130" y="35">Lens width</text><text x="225" y="200">Bridge</text><text x="220" y="235">Total front width</text></g></svg>'}
function stepSize(){return '<h1>Size & Geometry</h1><p class="muted">Enter only what you know. Unknown values can be proposed by the development team.</p><div class="measure">'+measureSvg()+'</div>'+pills(['Known','Partial','Follow Reference','Development Team Recommendation'],s.size.mode,'size.mode')+'<div class="fields">'+inp('Lens Width (mm)','size.w',s.size.w)+inp('Lens Height (mm)','size.h',s.size.h)+inp('Bridge / DBL (mm)','size.bridge',s.size.bridge)+inp('Total Front Width (mm)','size.front',s.size.front)+inp('Temple Length (mm)','size.temple',s.size.temple)+'</div>'+nav()}
function stepLens(){var mats=['Nylon','PC','CR39','TAC Polarized','Acrylic','Demo Lens'];var curves=['0','2','4','6','8'];var colors=['Grey','Green','Brown','Blue','Pink','Yellow','Clear'];var tr=['UV400','Hard Coating','AR','Backside / Inner AR Only','Mirror','Hydrophobic'];return '<h1>Lens</h1><h2>Material</h2>'+pills(mats,s.lens.material,'lens.material')+'<div class="fields">'+inp('Thickness (mm)','lens.thick',s.lens.thick,'e.g. 2.2')+inp('Lens Color','lens.color',s.lens.color)+'</div><h2>Base Curve</h2><div class="grid">'+curves.map(function(x){return card(x,'Base '+x+(x==='0'?' / Flat':''),s.lens.curve,curveVis(x),'lens.curve')}).join('')+'</div><h2>Tint</h2>'+pills(['Solid','Gradient','Double Gradient','Mirror','Flash Mirror','Clear'],s.lens.tint,'lens.tint')+'<div class="field"><span>Darkness: <b>'+s.lens.dark+'%</b></span><input data-path="lens.dark" type="range" min="0" max="95" step="5" value="'+s.lens.dark+'"></div><h2>Treatments</h2><div class="checks">'+tr.map(function(x){return '<label><input type="checkbox" data-treat="'+x+'" '+(s.lens.treat.indexOf(x)>=0?'checked':'')+'> '+x+'</label>'}).join('')+'</div>'+nav()}
function stepComponents(){return '<h1>Components</h1><h2>Hinge</h2>'+pills(['Standard Barrel','Spring Hinge','Hidden Hinge','Custom / Decorative','Development Team Recommendation'],s.components.hinge,'components.hinge')+'<h2>Nose Pad</h2>'+pills(['Integrated','Silicone','PVC','Metal','Adjustable','Development Team Recommendation'],s.components.nose,'components.nose')+nav()}
function mapSvg(){return '<svg viewBox="0 0 520 280"><g fill="none" stroke="#111827" stroke-width="6"><rect x="55" y="70" width="160" height="95" rx="32"/><rect x="305" y="70" width="160" height="95" rx="32"/><path d="M215 110Q260 85 305 110M55 110L15 98M465 110l40-12"/></g><g><circle class="spot" data-a="addmark" data-v="Front Left" cx="92" cy="120" r="22"/><circle class="spot" data-a="addmark" data-v="Front Right" cx="428" cy="120" r="22"/><rect class="spot" data-a="addmark" data-v="Left Temple Outside" x="10" y="90" width="45" height="20" rx="8"/><rect class="spot" data-a="addmark" data-v="Right Temple Outside" x="465" y="90" width="45" height="20" rx="8"/></g><text x="260" y="245" text-anchor="middle" fill="#64748b" font-size="14">Click a highlighted area to add logo / marking</text></svg>'}
function stepLogo(){return '<h1>Logo & Markings</h1><p class="muted">Click the eyewear drawing to place branding or required markings.</p><div class="hotspots"><div class="logo-map">'+mapSvg()+'</div><div class="marklist"><b>Markings</b>'+s.marks.map(function(m,i){return '<button data-a="editmark" data-v="'+i+'"><b>①'.replace('①',String(i+1))+' '+esc(m.loc)+'</b><br><small>'+esc(m.content)+' — '+esc(m.method)+'</small></button>'}).join('')+'</div></div>'+nav()}
function extraIcon(x){return '<svg viewBox="0 0 220 100"><rect x="65" y="20" width="90" height="60" rx="10" fill="none" stroke="#111827" stroke-width="4"/><text x="110" y="56" text-anchor="middle" font-size="13">'+esc(x)+'</text></svg>'}
function stepExtras(){var xs=['Lens Sticker','Hangtag','Cleaning Cloth','Pouch','Hard Case','Polybag','Box'];return '<h1>Sample Extras</h1><p class="muted">Only items needed to prepare the development sample.</p><div class="grid">'+xs.map(function(x){return card(x,x,s.extras.indexOf(x)>=0?x:'',extraIcon(x),'extra')}).join('')+'</div><label class="field"><span>Special Development Instructions</span><textarea data-path="notes">'+esc(s.notes)+'</textarea></label>'+nav()}
function complete(){var miss=[];if(!s.project.style)miss.push('Style / Model No.');if(!s.frame.material)miss.push('Frame material');if(!s.lens.material)miss.push('Lens material');if(!s.lens.curve)miss.push('Lens curve');return miss}
function stepReview(){var miss=complete();return '<h1>Review Your Sample</h1>'+(miss.length?'<div class="warn"><b>Almost ready</b><br>Needs decision: '+miss.join(', ')+'</div>':'<div class="ok"><b>Ready for development sheet</b></div>')+'<div class="review"><div><h3>Frame</h3><p>'+esc(s.frame.material)+' / '+esc(s.frame.color||'To Be Confirmed')+' / '+esc(s.frame.finish)+'</p></div><div><h3>Lens</h3><p>'+esc(s.lens.material)+' / '+esc(s.lens.thick||'Development Team Recommendation')+' mm / Base '+esc(s.lens.curve)+' / '+esc(s.lens.color)+' '+esc(s.lens.dark)+'%</p></div><div><h3>Components</h3><p>'+esc(s.components.hinge)+' / '+esc(s.components.nose)+'</p></div><div><h3>Logo</h3><p>'+s.marks.length+' marking location(s)</p></div></div><div style="margin-top:18px" class="pill"><button data-a="print" data-v="en">Print / PDF English</button><button data-a="print" data-v="zh">打印 / PDF 中文</button><button data-a="json">Export Project JSON</button><button data-a="xls">Export Excel-compatible XLS</button></div>'+nav()}
function content(){return[stepStart,stepRefs,stepFrame,stepSize,stepLens,stepComponents,stepLogo,stepExtras,stepReview][s.i]()}
function summary(){return '<div class="panel side"><h3>Your Sample</h3><div class="summary"><div class="sum"><b>Model</b>'+esc(s.project.style||'—')+'</div><div class="sum"><b>Frame</b>'+esc(s.frame.material)+' / '+esc(s.frame.color||'—')+'</div><div class="sum"><b>Lens</b>'+esc(s.lens.material)+' / Base '+esc(s.lens.curve)+' / '+esc(s.lens.color)+'</div><div class="sum"><b>Logo</b>'+s.marks.length+' location(s)</div><div class="sum"><b>References</b>'+s.refs.length+'</div></div></div>'}
function render(){var tr=T[s.lang];document.documentElement.dir=s.lang==='he'?'rtl':'ltr';q('#app').innerHTML='<div class="top"><div class="brand"><div class="mark">C</div><div><b>CONCHEN</b><div class="muted" style="font-size:11px">GLASSES DEVELOPMENT</div></div></div><div class="actions"><button class="btn" data-a="lang">'+(s.lang==='en'?'עברית':'English')+'</button><button class="btn" data-a="reset">New</button></div></div><div class="progress">'+steps.map(function(x,i){return '<button class="'+(i===s.i?'on':'')+'" data-a="jump" data-v="'+i+'">'+(i+1)+'. '+tr[x]+'</button>'}).join('')+'</div><div class="wrap"><main class="panel">'+content()+'</main>'+summary()+'</div>';bind()}
function set(path,val){var p=path.split('.'),o=s;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;save()}
function bind(){document.querySelectorAll('[data-path]').forEach(function(el){el.oninput=function(){set(el.dataset.path,el.value);if(el.type==='range')render()}});var up=q('#refup');if(up)up.onchange=function(){var f=up.files[0];if(!f)return;var r=new FileReader;r.onload=function(){s.refs.push({id:'R'+String(s.refs.length+1).padStart(2,'0'),name:f.name,data:r.result,follow:[],dont:[]});save();render()};r.readAsDataURL(f)};document.querySelectorAll('[data-ref]').forEach(function(el){el.onchange=function(){var r=s.refs[+el.dataset.ref],k=el.dataset.type==='follow'?'follow':'dont',other=k==='follow'?'dont':'follow',a=el.dataset.aspect;if(el.checked){if(r[k].indexOf(a)<0)r[k].push(a);r[other]=r[other].filter(function(x){return x!==a})}else r[k]=r[k].filter(function(x){return x!==a});save();render()}});document.querySelectorAll('[data-treat]').forEach(function(el){el.onchange=function(){var x=el.dataset.treat;s.lens.treat=el.checked?s.lens.treat.concat([x]).filter(function(v,i,a){return a.indexOf(v)===i}):s.lens.treat.filter(function(v){return v!==x});save()}})}
function action(a,v){if(a==='next'){if(s.i<8)s.i++;else printSheet('en')}if(a==='prev')s.i=Math.max(0,s.i-1);if(a==='jump')s.i=+v;if(a==='lang')s.lang=s.lang==='en'?'he':'en';if(a.indexOf('.')>0)set(a,v);if(a==='delref'){s.refs.splice(+v,1);s.refs.forEach(function(r,i){r.id='R'+String(i+1).padStart(2,'0')})}if(a==='extra'){var j=s.extras.indexOf(v);if(j>=0)s.extras.splice(j,1);else s.extras.push(v)}if(a==='addmark')markEditor(v);if(a==='editmark')markEditor(s.marks[+v].loc,+v);if(a==='print')printSheet(v);if(a==='json')download(JSON.stringify(s,null,2),'conchen-development-project.json','application/json');if(a==='xls')xls();if(a==='reset'&&confirm('Start a new project?'))s=fresh();save();render()}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(el)action(el.dataset.a,el.dataset.v)})
function markEditor(loc,idx){var old=idx!=null?s.marks[idx]:{loc:loc,content:'',method:'Laser Engraving',size:'',color:''};var methods=['Silk Screen','Pad Print','Laser Engraving','Hot Stamping','Metal Logo','Metal Insert','Embossed','Debossed'];var box=document.createElement('div');box.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:grid;place-items:center;padding:20px';box.innerHTML='<div class="panel" style="max-width:700px;width:100%"><h2>Add Marking — '+esc(loc)+'</h2>'+inp('Logo / Text','mcontent',old.content,'TS / Model No. / CE')+'<h3>Application Method</h3><div class="grid">'+methods.map(function(m){return card(m,m,old.method,logoVis(m),'mmethod')}).join('')+'</div>'+inp('Approx. Size','msize',old.size,'12 × 3 mm')+inp('Color / Pantone','mcolor',old.color,'Gold / Pantone')+'<div class="nav"><button class="btn" id="mcancel">Cancel</button><button class="btn primary" id="msave">Save</button></div></div>';document.body.appendChild(box);var method=old.method;box.querySelectorAll('[data-a="mmethod"]').forEach(function(b){b.onclick=function(){method=b.dataset.v;box.querySelectorAll('.card').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel')}});box.querySelector('#mcancel').onclick=function(){box.remove()};box.querySelector('#msave').onclick=function(){var m={loc:loc,content:box.querySelector('[data-path="mcontent"]').value,method:method,size:box.querySelector('[data-path="msize"]').value,color:box.querySelector('[data-path="mcolor"]').value};if(idx!=null)s.marks[idx]=m;else s.marks.push(m);save();box.remove();render()}}
function refText(r,lang){var f=r.follow.join(', ')||'—',d=r.dont.join(', ')||'—';return lang==='zh'?'参考 '+r.id+'：参考 '+f+'；不要参考 '+d:r.id+': Follow '+f+'. Do not follow '+d+'.'}
function printSheet(lang){var cn=lang==='zh',lab=function(x){return cn?(zh[x]||x):x};var marks=s.marks.map(function(m,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(m.loc)+'</td><td>'+esc(m.content)+'</td><td>'+esc(m.method)+'</td><td>'+esc(m.size)+'</td><td>'+esc(m.color)+'</td></tr>'}).join('');var refs=s.refs.map(function(r){return '<div style="page-break-inside:avoid;margin:12px 0"><b>'+r.id+'</b><br><img src="'+r.data+'" style="max-width:340px;max-height:220px"><p>'+esc(refText(r,lang))+'</p></div>'}).join('');var h='<!doctype html><meta charset="utf-8"><title>'+lab('Sample Development Sheet')+'</title><style>body{font-family:Arial,sans-serif;padding:26px;color:#111}h1{border-bottom:3px solid #111;padding-bottom:10px}h2{margin-top:28px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px;text-align:left}img{object-fit:contain}@media print{button{display:none}}</style><body><h1>'+lab('Sample Development Sheet')+'</h1><p><b>Development ID:</b> '+esc(s.project.id)+' &nbsp; <b>Brand:</b> '+esc(s.project.brand)+' &nbsp; <b>Model:</b> '+esc(s.project.style)+'</p><h2>'+lab('Frame')+'</h2><table><tr><td>'+lab('Material')+'</td><td>'+esc(s.frame.material)+'</td></tr><tr><td>'+lab('Color')+'</td><td>'+esc(s.frame.color||lab('To Be Confirmed'))+'</td></tr><tr><td>'+lab('Finish')+'</td><td>'+esc(s.frame.finish)+'</td></tr></table><h2>'+lab('Lens')+'</h2><table><tr><td>'+lab('Material')+'</td><td>'+esc(s.lens.material)+'</td></tr><tr><td>'+lab('Thickness')+'</td><td>'+esc(s.lens.thick||lab('Development Team Recommendation'))+'</td></tr><tr><td>'+lab('Base Curve')+'</td><td>Base '+esc(s.lens.curve)+(s.lens.curve==='0'?' / Flat':'')+'</td></tr><tr><td>'+lab('Color')+'</td><td>'+esc(s.lens.color)+' '+esc(s.lens.dark)+'%</td></tr><tr><td>Treatments</td><td>'+esc(s.lens.treat.join(', '))+'</td></tr></table><h2>'+lab('Hinge')+' / '+lab('Nose Pad')+'</h2><p>'+esc(s.components.hinge)+' / '+esc(s.components.nose)+'</p><h2>Logo & Markings</h2><table><tr><th>#</th><th>Location</th><th>Content</th><th>Method</th><th>Size</th><th>Color</th></tr>'+marks+'</table><h2>Sample Extras</h2><p>'+esc(s.extras.join(', '))+'</p><h2>Special Instructions</h2><p>'+esc(s.notes||'—')+'</p><h2>References</h2>'+refs+'<script>onload=function(){setTimeout(function(){print()},300)}<\/script></body>';var w=open('','_blank');w.document.write(h);w.document.close()}
function download(c,n,t){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}
function xls(){var rows=[['Development ID',s.project.id],['Brand',s.project.brand],['Model',s.project.style],['Frame Material',s.frame.material],['Frame Color',s.frame.color],['Frame Finish',s.frame.finish],['Lens Material',s.lens.material],['Lens Thickness',s.lens.thick],['Lens Base Curve','Base '+s.lens.curve],['Lens Color',s.lens.color],['Lens Darkness',s.lens.dark+'%'],['Treatments',s.lens.treat.join(', ')],['Hinge',s.components.hinge],['Nose Pad',s.components.nose],['Logo Markings',s.marks.length],['Special Instructions',s.notes]];var xml='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="EN Development"><Table>'+rows.map(function(r){return '<Row>'+r.map(function(c){return '<Cell><Data ss:Type="String">'+esc(c)+'</Data></Cell>'}).join('')+'</Row>'}).join('')+'</Table></Worksheet></Workbook>';download(xml,(s.project.style||'sample')+'-development.xls','application/vnd.ms-excel')}
render()
})();
